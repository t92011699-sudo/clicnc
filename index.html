<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicnc API - نظام حجز العيادات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; line-height: 1.6; }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }
        .links {
            margin-top: 20px;
            text-align: right;
        }
        .links a {
            display: block;
            color: #3498db;
            text-decoration: none;
            margin: 5px 0;
        }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clicnc API</h1>
        <p>مرحباً بك في الواجهة البرمجية لنظام حجز العيادات.</p>
        <div class="status">النظام يعمل بنجاح</div>
        <div class="links">
            <strong>روابط الـ API المتوفرة:</strong>
            <a href="/api/departments">/api/departments - الأقسام</a>
            <a href="/api/doctors">/api/doctors - الأطباء</a>
            <a href="/api/timeslots">/api/timeslots - المواعيد المتاحة</a>
            <a href="/api/bookings">/api/bookings - الحجوزات</a>
        </div>
    </div>
</body>
</html>
